databases:
  - name: agrilink-db
    plan: free
    databaseName: agrilink
    user: agrilink

services:
  - type: web
    runtime: python
    name: agrilink
    plan: free
    buildCommand: bash build.sh
    startCommand: "python backend/manage.py migrate --noinput && python -m gunicorn Agricultural.wsgi:application --chdir backend --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DATABASE_URL
        fromDatabase:
          name: agrilink-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "True"
      - key: SECURE_HSTS_PRELOAD
        value: "True"
      - key: WEB_CONCURRENCY
        value: "2"
